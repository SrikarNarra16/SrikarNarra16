<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Srikar Narra">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050109"/>
      <stop offset="0.6" stop-color="#0b0418"/>
      <stop offset="1" stop-color="#140a2b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.78" r="0.7">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.28"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="2"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#sky)"/>
    <rect width="1200" height="300" fill="url(#haze)"/>

    <!-- faint skyline for depth -->
    <g fill="#0f0a24" opacity="0.8">
      <rect x="86" y="150" width="26" height="52"/>
      <rect x="120" y="128" width="30" height="74"/>
      <rect x="158" y="162" width="16" height="40"/>
      <rect x="1026" y="140" width="30" height="62"/>
      <rect x="1064" y="120" width="20" height="82"/>
      <rect x="1092" y="158" width="22" height="44"/>
    </g>

    <!-- perspective grid: static verticals -->
    <g stroke="#22d3ee" stroke-opacity="0.12" stroke-width="1">
      <line x1="-420" y1="300" x2="600" y2="202"/>
      <line x1="-160" y1="300" x2="600" y2="202"/>
      <line x1="80"   y1="300" x2="600" y2="202"/>
      <line x1="300"  y1="300" x2="600" y2="202"/>
      <line x1="480"  y1="300" x2="600" y2="202"/>
      <line x1="600"  y1="300" x2="600" y2="202"/>
      <line x1="720"  y1="300" x2="600" y2="202"/>
      <line x1="900"  y1="300" x2="600" y2="202"/>
      <line x1="1140" y1="300" x2="600" y2="202"/>
      <line x1="1360" y1="300" x2="600" y2="202"/>
      <line x1="1620" y1="300" x2="600" y2="202"/>
    </g>
    <!-- perspective grid: eased scrolling horizontals -->
    <g fill="url(#neon)">
      <rect x="0" width="1200" height="1.2">
        <animate attributeName="y" values="202;300" dur="4s" repeatCount="indefinite" begin="0s" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 1 1"/>
        <animate attributeName="opacity" values="0;0.12;0.55" dur="4s" repeatCount="indefinite" begin="0s"/>
      </rect>
      <rect x="0" width="1200" height="1.2">
        <animate attributeName="y" values="202;300" dur="4s" repeatCount="indefinite" begin="1s" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 1 1"/>
        <animate attributeName="opacity" values="0;0.12;0.55" dur="4s" repeatCount="indefinite" begin="1s"/>
      </rect>
      <rect x="0" width="1200" height="1.2">
        <animate attributeName="y" values="202;300" dur="4s" repeatCount="indefinite" begin="2s" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 1 1"/>
        <animate attributeName="opacity" values="0;0.12;0.55" dur="4s" repeatCount="indefinite" begin="2s"/>
      </rect>
      <rect x="0" width="1200" height="1.2">
        <animate attributeName="y" values="202;300" dur="4s" repeatCount="indefinite" begin="3s" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 1 1"/>
        <animate attributeName="opacity" values="0;0.12;0.55" dur="4s" repeatCount="indefinite" begin="3s"/>
      </rect>
    </g>
    <!-- horizon line -->
    <rect x="0" y="201" width="1200" height="1.5" fill="url(#neon)" opacity="0.7" filter="url(#glow)"/>

    <!-- title: constant chromatic aberration, single soft breath -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="76" text-anchor="middle" letter-spacing="10">
      <text x="602.5" y="128" fill="#f472b6" opacity="0.5">SRIKAR NARRA</text>
      <text x="597.5" y="128" fill="#22d3ee" opacity="0.5">SRIKAR NARRA</text>
      <text x="600" y="128" fill="#f5f7ff">SRIKAR NARRA
        <animate attributeName="opacity" values="1;0.94;1" dur="5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- role line -->
    <text x="600" y="164" text-anchor="middle" font-family="'Courier New', ui-monospace, monospace" font-size="15" letter-spacing="7" fill="#9db4d0">SOFTWARE &#183; MACHINE LEARNING &#183; SYSTEMS</text>

    <!-- subtle scanlines + slow sweep -->
    <rect width="1200" height="300" fill="url(#scan)" opacity="0.4"/>
    <rect x="0" width="1200" height="60" fill="#22d3ee" opacity="0.035">
      <animate attributeName="y" values="-80;320" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.7 1"/>
    </rect>
    <rect x="0.5" y="0.5" width="1199" height="299" rx="2" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="1"/>
  </g>
</svg>
