<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Srikar Narra">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04010a"/>
      <stop offset="0.55" stop-color="#0d0221"/>
      <stop offset="1" stop-color="#1c0640"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.62" r="0.65">
      <stop offset="0" stop-color="#7a1fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7a1fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000000" opacity="0.35"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#sky)"/>
    <rect width="1200" height="320" fill="url(#haze)"/>

    <!-- distant skyline silhouette -->
    <g fill="#120a2e" opacity="0.9">
      <rect x="70"  y="120" width="26" height="80"/>
      <rect x="104" y="150" width="18" height="50"/>
      <rect x="128" y="96"  width="30" height="104"/>
      <rect x="166" y="140" width="16" height="60"/>
      <rect x="980" y="110" width="28" height="90"/>
      <rect x="1016" y="150" width="16" height="50"/>
      <rect x="1040" y="88"  width="32" height="112"/>
      <rect x="1082" y="132" width="18" height="68"/>
      <rect x="1108" y="150" width="22" height="50"/>
    </g>
    <g fill="#00e5ff">
      <rect x="136" y="108" width="4" height="4" opacity="0.8"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.3s" repeatCount="indefinite"/></rect>
      <rect x="1050" y="100" width="4" height="4" opacity="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.7s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#ff2e97">
      <rect x="146" y="128" width="3" height="3" opacity="0.7"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="1090" y="120" width="3" height="3" opacity="0.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/></rect>
    </g>

    <!-- neon perspective grid floor -->
    <g stroke="#00e5ff" stroke-opacity="0.22" stroke-width="1">
      <line x1="-600" y1="320" x2="600" y2="214"/>
      <line x1="-360" y1="320" x2="600" y2="214"/>
      <line x1="-140" y1="320" x2="600" y2="214"/>
      <line x1="60"   y1="320" x2="600" y2="214"/>
      <line x1="250"  y1="320" x2="600" y2="214"/>
      <line x1="430"  y1="320" x2="600" y2="214"/>
      <line x1="600"  y1="320" x2="600" y2="214"/>
      <line x1="770"  y1="320" x2="600" y2="214"/>
      <line x1="950"  y1="320" x2="600" y2="214"/>
      <line x1="1140" y1="320" x2="600" y2="214"/>
      <line x1="1340" y1="320" x2="600" y2="214"/>
      <line x1="1560" y1="320" x2="600" y2="214"/>
      <line x1="1800" y1="320" x2="600" y2="214"/>
    </g>
    <!-- scrolling horizontal grid lines -->
    <g stroke="url(#neon)" stroke-width="1.4">
      <line x1="0" x2="1200"><animate attributeName="y1" values="214;320" dur="3.2s" repeatCount="indefinite" begin="0s"/><animate attributeName="y2" values="214;320" dur="3.2s" repeatCount="indefinite" begin="0s"/><animate attributeName="stroke-opacity" values="0;0.15;0.75" dur="3.2s" repeatCount="indefinite" begin="0s"/></line>
      <line x1="0" x2="1200"><animate attributeName="y1" values="214;320" dur="3.2s" repeatCount="indefinite" begin="0.8s"/><animate attributeName="y2" values="214;320" dur="3.2s" repeatCount="indefinite" begin="0.8s"/><animate attributeName="stroke-opacity" values="0;0.15;0.75" dur="3.2s" repeatCount="indefinite" begin="0.8s"/></line>
      <line x1="0" x2="1200"><animate attributeName="y1" values="214;320" dur="3.2s" repeatCount="indefinite" begin="1.6s"/><animate attributeName="y2" values="214;320" dur="3.2s" repeatCount="indefinite" begin="1.6s"/><animate attributeName="stroke-opacity" values="0;0.15;0.75" dur="3.2s" repeatCount="indefinite" begin="1.6s"/></line>
      <line x1="0" x2="1200"><animate attributeName="y1" values="214;320" dur="3.2s" repeatCount="indefinite" begin="2.4s"/><animate attributeName="y2" values="214;320" dur="3.2s" repeatCount="indefinite" begin="2.4s"/><animate attributeName="stroke-opacity" values="0;0.15;0.75" dur="3.2s" repeatCount="indefinite" begin="2.4s"/></line>
    </g>
    <!-- horizon glow -->
    <rect x="0" y="212" width="1200" height="2.5" fill="url(#neon)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite"/>
    </rect>

    <!-- ================= GLITCH TITLE ================= -->
    <g font-family="'Courier New', ui-monospace, monospace" font-weight="bold" font-size="82" text-anchor="middle" letter-spacing="6">
      <text x="600" y="130" fill="#ff2e97" opacity="0.85" filter="url(#softglow)">SRIKAR NARRA
        <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
          keyTimes="0;0.27;0.29;0.32;0.34;0.68;0.70;0.73;1"
          values="0 0;0 0;-6 0;5 -1;0 0;0 0;7 1;-5 0;0 0"/>
      </text>
      <text x="600" y="130" fill="#00e5ff" opacity="0.85" filter="url(#softglow)">SRIKAR NARRA
        <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
          keyTimes="0;0.27;0.29;0.32;0.34;0.68;0.70;0.73;1"
          values="0 0;0 0;6 0;-5 1;0 0;0 0;-7 -1;5 0;0 0"/>
      </text>
      <text x="600" y="130" fill="#f4f8ff">SRIKAR NARRA</text>
    </g>

    <!-- subtitle + cursor -->
    <g font-family="'Courier New', ui-monospace, monospace" text-anchor="middle">
      <text x="600" y="172" font-size="17" letter-spacing="3" fill="#8be9ff" opacity="0.85">// more human than human &#183; a developer in the neon rain</text>
    </g>
    <g font-family="'Courier New', ui-monospace, monospace" font-size="15" letter-spacing="2">
      <text x="474" y="200" fill="#00e5ff" opacity="0.9">&#62; ONLINE</text>
      <circle cx="452" cy="195" r="4" fill="#39ff14"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <text x="600" y="200" fill="#a855f7" opacity="0.8">&#183;</text>
      <text x="726" y="200" fill="#ff2e97" opacity="0.9">SECTOR&#95;16&#95;NEXUS</text>
      <rect x="836" y="189" width="10" height="14" fill="#ff2e97"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- scanline overlay -->
    <rect width="1200" height="320" fill="url(#scan)" opacity="0.5"/>
    <!-- moving scan sweep -->
    <rect x="0" width="1200" height="46" fill="#00e5ff" opacity="0.05">
      <animate attributeName="y" values="-60;340" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <!-- edge vignette -->
    <rect width="1200" height="320" fill="none" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
